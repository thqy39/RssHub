<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f6f4" />
    <title>Jasper's RSS · 阅读器</title>
    <link rel="stylesheet" href="/assets/css/app.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">r</div>
          <div>
            <h1>Jasper's RSS</h1>
            <p>你的安静阅读空间</p>
          </div>
          <button
            id="languageToggle"
            class="language-toggle"
            type="button"
            aria-label="切换语言"
            title="切换语言"
          >
            EN
          </button>
        </div>
        <div class="sidebar-tools">
          <nav aria-label="文章筛选">
            <ul class="nav-list">
              <li>
                <button class="nav-button active" data-view="all">
                  <span class="nav-icon">◫</span>全部文章
                  <span id="allCount" class="count"></span>
                </button>
              </li>
              <li>
                <button class="nav-button" data-view="unread">
                  <span class="nav-icon">●</span>未读
                  <span id="unreadCount" class="count"></span>
                </button>
              </li>
            </ul>
          </nav>
        </div>
        <div class="mobile-shortcuts">
          <button id="openCatalog" class="catalog-launch" type="button">
            <span class="catalog-launch-icon">✳</span>
            <span class="catalog-launch-copy"
              ><strong>精选订阅源</strong
              ><small>100 个海内外优质来源</small></span
            >
            <span class="catalog-launch-arrow">→</span>
          </button>
          <button
            id="openFeedManager"
            class="mobile-feed-manager-launch"
            type="button"
          >
            <strong>订阅源</strong><span id="mobileFeedCount">0 个来源</span
            ><span class="manager-chevron">管理 →</span>
          </button>
          <button
            id="openAddDialog"
            class="mobile-add-launch"
            type="button"
            aria-label="添加订阅"
            title="添加订阅"
          >
            ＋
          </button>
        </div>
        <section class="feed-area">
          <h2 class="section-label">订阅源</h2>
          <ul id="feedList" class="feed-list"></ul>
        </section>
        <div id="addFormHome"></div>
        <form id="addForm" class="add-box">
          <label for="feedUrl">添加 RSS / Atom 订阅</label>
          <div class="add-row">
            <input
              id="feedUrl"
              type="url"
              inputmode="url"
              placeholder="https://example.com/feed.xml"
              required
            /><button id="addButton" class="button">添加</button>
          </div>
          <div class="backup-actions">
            <button id="exportButton" type="button" class="text-button">
              导出 OPML</button
            ><button id="importButton" type="button" class="text-button">
              导入 OPML</button
            ><input
              id="opmlFile"
              type="file"
              accept=".opml,.xml,text/xml,application/xml"
              hidden
            />
          </div>
        </form>
        <div class="side-foot">本地保存 · 标准 RSS 与 Atom</div>
      </aside>
      <main class="list-pane">
        <header class="list-head">
          <div class="list-head-top">
            <div>
              <h2 id="listTitle">全部文章</h2>
              <div id="listSub" class="list-sub">正在读取订阅…</div>
            </div>
            <div class="head-actions">
              <button
                id="markAllButton"
                class="mark-all"
                title="将当前筛选中的文章全部标为已读"
              >
                全部已读</button
              ><button
                id="refreshButton"
                class="icon-button"
                title="刷新全部订阅"
                aria-label="刷新全部订阅"
              >
                ↻
              </button>
            </div>
          </div>
        </header>
        <div class="search-wrap">
          <input
            id="search"
            class="search"
            type="search"
            placeholder="搜索文章标题或摘要…"
            aria-label="搜索文章"
          />
        </div>
        <div id="items" class="items" aria-live="polite"></div>
      </main>
      <article id="reader" class="reader">
        <div class="reader-empty">
          <div class="empty-icon">⌁</div>
          <strong>选一篇文章，开始阅读</strong
          ><span>订阅更新会安静地汇集在这里。</span>
        </div>
      </article>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <dialog id="catalogDialog" class="catalog-dialog">
      <div class="catalog-shell">
        <header class="catalog-header">
          <div class="catalog-heading">
            <span class="catalog-kicker">RSSHUB DIRECTORY</span>
            <h2>发现值得订阅的内容</h2>
            <p>精选海内外来源，添加到你的阅读空间。</p>
          </div>
          <button
            id="closeCatalog"
            class="catalog-close"
            type="button"
            aria-label="关闭"
          >
            ×
          </button>
        </header>
        <div class="catalog-toolbar">
          <input
            id="catalogSearch"
            class="catalog-search"
            type="search"
            placeholder="搜索来源、主题或分类…"
            aria-label="搜索精选源"
          />
          <div id="catalogCategories" class="catalog-categories"></div>
        </div>
        <div class="catalog-results-head">
          <span id="catalogCount">100 个精选源</span
          ><button id="selectVisible" class="catalog-text-button" type="button">
            选择当前结果
          </button>
        </div>
        <div id="curatedList" class="curated-grid"></div>
        <footer class="catalog-footer">
          <span id="selectedCount">已选 0 个</span>
          <div>
            <button
              id="clearSelection"
              class="catalog-text-button"
              type="button"
            >
              清空</button
            ><button
              id="addSelected"
              class="catalog-add-selected"
              type="button"
              disabled
            >
              添加已选来源
            </button>
          </div>
        </footer>
      </div>
    </dialog>
    <dialog id="feedManagerDialog" class="feed-manager">
      <div class="feed-manager-shell">
        <header class="feed-manager-header">
          <div>
            <h2>管理订阅源</h2>
            <p id="feedManagerCount">0 个来源</p>
          </div>
          <button
            id="closeFeedManager"
            class="catalog-close"
            type="button"
            aria-label="关闭"
          >
            ×
          </button>
        </header>
        <div class="feed-manager-search-wrap">
          <input
            id="feedManagerSearch"
            class="feed-manager-search"
            type="search"
            placeholder="搜索订阅源…"
            aria-label="搜索已订阅来源"
          />
        </div>
        <ul id="mobileFeedList" class="feed-manager-list"></ul>
      </div>
    </dialog>
    <dialog id="addFeedDialog" class="add-feed-dialog">
      <header class="add-feed-dialog-header">
        <h2>添加订阅</h2>
        <button
          id="closeAddDialog"
          class="catalog-close"
          type="button"
          aria-label="关闭"
        >
          ×
        </button>
      </header>
      <div id="addDialogSlot" class="add-feed-dialog-content"></div>
    </dialog>
    <script type="module" src="/assets/js/app.js"></script>
  </body>
</html>
